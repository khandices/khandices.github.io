<!-- CONTACT -->
<section id="contact">
    <div class="contactInner">
        <div class="sectionTitle">Contact</div>
        <div class="sectionSubtitle">// get in touch</div>

        <form class="contactForm" action="https://formsubmit.co/s.khandice@gmail.com" method="POST">
            <!-- FormSubmit config -->
            <input type="hidden" name="_subject" value="New message from your portfolio!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <!-- Redirect back to your page after submission (update URL to your live domain) -->
            <input type="hidden" name="_next" value="https://khandices.github.io/portfolio">

            <div class="formRow">
                <div class="formGroup">
                    <label for="contactName">Name</label>
                    <input type="text" id="contactName" name="name" placeholder="Your name" required>
                </div>
                <div class="formGroup">
                    <label for="contactEmail">Email</label>
                    <input type="email" id="contactEmail" name="email" placeholder="your@email.com" required>
                </div>
            </div>
            <div class="formGroup">
                <label for="contactSubject">Subject</label>
                <input type="text" id="contactSubject" name="subject" placeholder="What's this about?">
            </div>
            <div class="formGroup">
                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" name="message" placeholder="Your message..." required></textarea>
            </div>
            <button type="submit" class="submitBtn">Send Message</button>
        </form>
    </div>
</section>

<!-- FOOTER -->
<footer>

<!-- PROJECT DATA + RENDER -->
<script>
    const projects = [
        {
            projectName: "Funemployment",
            summary: "During my stint of unemployment, I wanted a cleaner way of tracking my job applications and visualizing my job search data. [Currently in progress]",
            tech: ["React", "Python", "PostgreSQL"],
            gitHubLink: "https://github.com/khandices/funemployment-app",
            liveLink:   "https://khandices.github.io/portfolio"
        }
    ];

    function createProjectCard(project) {
        const card = document.createElement("div");
        card.className = "projectCard";

        const name = document.createElement("div");
        name.className = "projectName";
        name.innerText = project.projectName;
        card.appendChild(name);

        const summary = document.createElement("div");
        summary.className = "projectSummary";
        summary.innerText = project.summary;
        card.appendChild(summary);

        const techList = document.createElement("div");
        techList.className = "techList";
        project.tech.forEach(t => {
            const bubble = document.createElement("span");
            bubble.className = "techBubble";
            bubble.innerText = t;
            techList.appendChild(bubble);
        });
        card.appendChild(techList);

        const links = document.createElement("div");
        links.className = "projectLinks";

        const gh = document.createElement("a");
        gh.href = project.gitHubLink;
        gh.target = "_blank";
        gh.innerText = "GitHub";
        gh.className = "gitHubLink";
        gh.ariaLabel = "Link to GitHub repo for " + project.projectName;
        links.appendChild(gh);

        const live = document.createElement("a");
        live.href = project.liveLink;
        live.target = "_blank";
        live.innerText = "Live";
        live.className = "liveLink";
        live.ariaLabel = "Live demo of " + project.projectName;
        links.appendChild(live);

        card.appendChild(links);
        return card;
    }

    document.addEventListener("DOMContentLoaded", () => {
        const list = document.getElementById("projectList");
        projects.forEach(p => list.appendChild(createProjectCard(p)));
    });
</script>
